  generatePDF("HZOS-Personal-Stagnation-Report", content, btn);
}

function report() {
  const R = calc();
  const V = R.filter(r => r.idx !== null);
  const ov = V.length ? V.reduce((a, r) => a + r.idx, 0) / V.length : 0;
  const c = cl(ov);

  let h = `
  <div class="card" style="margin-bottom:24px;">
    <span class="zn">PERSONAL STAGNATION REPORT</span>
    <h1 class="hero-title" style="margin-bottom:8px;">Personal Stagnation Report</h1>
    <p style="color:var(--mu);font-size:15px;margin-bottom:24px;">
      Diagnostic results synthesized from your 13 developmental dimensions and 90-day evidence log.
    </p>

    <div class="report-hero">
      <div class="report-score-block">
        <span class="report-score-title">Overall Stagnation Index</span>
        <div class="report-score-value">
          ${ov.toFixed(2)}<span> / 5</span>
        </div>
        <div>
          <span class="status-pill" style="background:${c[3]}">${c[1]}</span>
        </div>
      </div>
      <div style="flex:1;min-width:240px;">
        <h4 style="font-size:14px;font-weight:700;color:var(--g);margin-bottom:6px;">Interpretation</h4>
        <p style="font-size:14px;line-height:1.6;color:var(--tx);">${c[2]}</p>
      </div>
    </div>

    <div class="radar-wrapper">
      <h3 style="font-size:18px;font-weight:700;color:var(--g);margin-bottom:6px;">Zone Performance Radar</h3>
      <p style="font-size:13px;color:var(--mu);margin-bottom:16px;">
        Stagnation index = 6 − zone average. Further from the centre = greater restriction. A smaller shape is healthier.
      </p>
      ${radar(R)}
      <div class="legend-row">
        ${CL.map(c => `<span><i style="background:${c[3]}"></i>${c[1]}</span>`).join("")}
      </div>
    </div>

    <h2 style="font-size:22px;color:var(--g);margin:32px 0 16px;">Zone Performance Breakdown</h2>
    <div class="tiles">
      ${R.map((r, i) => tile(r, i)).join("")}
    </div>

    ${sections(R)}

    <p style="font-size:13px;color:var(--mu);margin:24px 0;">
      This is a developmental diagnostic instrument, not a clinical or psychological test. It does not establish causation or diagnose mental health conditions. Thresholds are proposed operational bands, not validated norms. Interpret scores with documented evidence and professional judgment.
    </p>

    <div class="nav-actions noprint" style="flex-wrap:wrap;gap:12px;">
      <button class="btn s" onclick="transitionTo(14, 0, 'prev')">← Back to Interview</button>
      <div style="display:flex;gap:10px;flex-wrap:wrap;">
        <button class="btn s" onclick="openResetModal()">Restart</button>
        <button class="btn s" onclick="dlWork(this)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:6px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>Interview workbook (.pdf)</button>
        <button class="btn" onclick="dlRep(this)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:6px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>Download report (.pdf)</button>
      </div>
    </div>
  </div>`;
  return h;
}

// Keyboard navigation support
window.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA" || e.target.tagName === "SELECT") return;
  if (S.p >= 1 && S.p <= 13 && S.s >= 1 && S.s <= 5) {
    if (["1", "2", "3", "4", "5"].includes(e.key)) {
      selectRating(S.p - 1, S.s - 1, Number(e.key));
    } else if (e.key.toLowerCase() === "n" || e.key === "0") {
      selectRating(S.p - 1, S.s - 1, "na");
    } else if (e.key === "ArrowLeft") {
      transitionTo(S.p, S.s - 1, "prev");
    } else if (e.key === "ArrowRight" || e.key === "Enter") {
      nextQuestion();
    }
  }
});

const EV_DESCS = [
  "No documented evidence available; based solely on subjective impression.",
  "Verbal or intentional claim without formal demonstration or artifacts.",
  "Specific, tangible real-world examples observed and demonstrated.",
  "Documented with verifiable records, deliverables, metrics, or artifacts.",
  "Sustained performance verified across multiple evaluation cycles."
];

function renderEvidenceLevelBadge(level) {
  if (level === "" || level === undefined || level === null) return "";
  const idx = Number(level);
  const colors = ["#b3401a", "#d0661a", "#c78a00", "#1f8a4c", "#00522a"];
  const titles = ["E0 – No Evidence", "E1 – Claimed", "E2 – Demonstrated", "E3 – Documented", "E4 – Sustained"];
  const color = colors[idx] || "var(--g)";
  const desc = EV_DESCS[idx] || "";
  return `
    <div class="evidence-pill-preview">
      <span class="pill-dot" style="background:${color};"></span>
      <div class="pill-content">
        <span class="pill-title" style="color:${color};">${titles[idx]}</span>
        <span class="pill-desc">${desc}</span>
      </div>
    </div>
  `;
}

function updateEvidenceBadge(k) {
  const el = document.getElementById("evidence-preview-" + k);
  if (el) {
    el.innerHTML = renderEvidenceLevelBadge(S.l[k]);
    if (S.l[k] !== "") {
      el.classList.add("show");
    } else {
      el.classList.remove("show");
    }
  }
}

function toggleCustomSelect(k, e) {
  if (e) {
    e.stopPropagation();
    e.preventDefault();
  }
  const menu = document.getElementById("custom-dropdown-menu-" + k);
  const trigger = document.getElementById("custom-select-trigger-" + k);
  if (!menu || !trigger) return;

  const isOpen = menu.classList.contains("open");
  closeAllCustomSelects();
  if (!isOpen) {
    menu.classList.add("open");
    trigger.classList.add("active");
    trigger.setAttribute("aria-expanded", "true");
  }
}

function closeAllCustomSelects() {
  document.querySelectorAll(".custom-dropdown-menu.open").forEach(m => {
    m.classList.remove("open");
  });
  document.querySelectorAll(".custom-select-trigger.active").forEach(t => {
    t.classList.remove("active");
    t.setAttribute("aria-expanded", "false");
  });
}

function selectCustomOption(k, i, e) {
  if (e) {
    e.stopPropagation();
    e.preventDefault();
  }
  S.l[k] = i;
  save();

  const label = document.getElementById("custom-select-label-" + k);
  if (label) label.textContent = EV[i];

  const hiddenInput = document.getElementById("evidence-level-" + k);
  if (hiddenInput) hiddenInput.value = i;

  updateEvidenceBadge(k);
  closeAllCustomSelects();

  const menu = document.getElementById("custom-dropdown-menu-" + k);
  if (menu) {
    menu.querySelectorAll(".custom-dropdown-item").forEach((item, idx) => {
      if (idx === i) {
        item.classList.add("selected");
        item.setAttribute("aria-selected", "true");
      } else {
        item.classList.remove("selected");
        item.setAttribute("aria-selected", "false");
      }
    });
  }
}

document.addEventListener("click", () => {
  closeAllCustomSelects();
});

function openResetModal() {
  const m = document.getElementById("reset-modal");
  if (m) {
    m.classList.add("open");
    document.body.style.overflow = "hidden";
  }
}

function closeResetModal() {
  const m = document.getElementById("reset-modal");
  if (m) {
    m.classList.remove("open");
    document.body.style.overflow = "";
  }
}

function handleModalBackdropClick(e) {
  if (e.target && e.target.id === "reset-modal") {
    closeResetModal();
  }
}

function confirmResetAssessment() {
  try {
    localStorage.removeItem("hzos");
  } catch (e) {}
  S = {
    nm: "",
    p: 0,
    s: 0,
    a: Z.map(() => []),
    t: Z.map(() => ""),
    l: Z.map(() => ""),
    q: Q.map(() => "")
  };
  save();
  closeResetModal();
  transitionTo(0, 0, "prev");
}

window.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    closeAllCustomSelects();
    closeResetModal();
  }
});

render();
</script>
</body>
</html>
